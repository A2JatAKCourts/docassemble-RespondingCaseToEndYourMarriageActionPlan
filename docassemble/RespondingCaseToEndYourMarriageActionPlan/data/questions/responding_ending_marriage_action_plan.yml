id: Domestic violence
comment: |
  last updated 2025-08-25 to take out agreeing with complaint in custody language in any circumstance where akcustody is not the only choice
question: |
  Do you want your Action Plan to include information about domestic violence resources and how domestic violence
  % if type_of_response.all_true('ak custody case', exclusive = True) and (response_to_complaint in('agree', 'some') or (response_to_complaint == 'none' and want_help_to_agree)):
  can affect your agreement?
  % else:
  affects your case?
  % endif
subquestion: |
  If there is 
  % if type_of_response.all_true('ak custody case', exclusive = True) and response_to_complaint == 'none' and not want_help_to_agree:
  a history of 
  % endif
  abuse or domestic violence between you and ${ other_party_in_case }, it may affect your case and 
  % if type_of_response.all_true('ak custody case', exclusive = True) and not (response_to_complaint == 'none' and not want_help_to_agree):
  what you can agree to in 
  % endif
  your parenting plan.

fields:
  - no label: domestic_violence
    datatype: yesnoradio
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more ####
  % if type_of_response.all_true('ak custody case', exclusive = True) and response_to_complaint in('agree', 'some'):
  Sometimes a person in a relationship with domestic violence feels pressured to agree to things they do not want. And the
  % else:
  The 
  % endif
  law presumes that a parent with a "history of domestic violence" may not get custody and unsupervised visitation without completing some court-approved treatment. The parent’s domestic violence behavior needs to fit under one of the domestic violence crimes in the law. A "history of domestic violence" is defined as one incident that caused serious physical injury, or more than one incident. The court can find domestic violence based on one parent’s testimony even if there was no protective order or criminal case.
---
id: Agree
question: |
  Do you agree with everything ${ other_party_in_case } asked for in their complaint?
fields:
  - no label: response_to_complaint
    input type: radio
    choices:
      - I agree with everything ${ other_party_in_case } asked for in the Complaint.: agree
      - I agree with some of what ${ other_party_in_case } asked for in the Complaint.: some
      - I do not agree with what ${ other_party_in_case } asked for in the Complaint.: none
---
id: Agree with legal separation
question: |
  Do you want a legal separation?
fields:
  - Which is your situation: want_legal_separation
    input type: radio
    choices:
      - I agree with getting a legal separation: yes
      - I do not want a legal separation - I want a divorce to end the marriage: no
      - I am not sure - I want more information about both added to my Action Plan: unsure
---
id: Is wife pregnant
question: |
  Is wife pregnant?
subquestion: |
   If a wife is pregnant when 
   % if case_type == 'divorce':
   a marriage ends
   % else:
   a couple legally separates
   % endif
   , the law considers the husband to be the father. If the husband is the father, the court will decide a parenting plan and child support. If the husband is not the father, the court can remove the husband’s rights and responsibilities for that child.
fields:
  - no label: wife_is_pregnant
    datatype: radio
    code: |
      wife_is_pregnant_options
---
code: |
  if user_need == 'divorce' and not minor_children and legal_separation_or_divorce == 'divorce'and not married_more_than_2 and pregnant: 
     wife_is_pregnant_options = [
      {'husband': "Wife is pregnant and husband is the father."},
      {'not husband': "Wife is pregnant and husband is not the father or spouses are unsure."}
        ]
  else: 
     wife_is_pregnant_options = [
      {'husband': "Wife is pregnant and husband is the father."},
      {'not husband': "Wife is pregnant and husband is not the father or spouses are unsure."},
      {'not pregnant': "No, the wife is not pregnant."}
        ]
---
id: Settlement
question: |
  Do you want your Action Plan to include information about resources to help you and ${ other_party_in_case } reach an agreement on the issues in your case?
fields:
  - no label: settlement
    datatype: yesnoradio
---
id: Paternity
question: |
  Do you want your Action Plan to include information about paternity?
subquestion: |
  Sometimes paternity is an issue in a custody case.  
  
  Establishing paternity means legally determining the biological father of a child.  
  
  Once established, the father's name can be placed on the child's birth certificate and he has legal and financial responsibility for the child. 
  
  Disestablishing paternity is legally un-naming a man as the child's biological father.  
fields:
  - no label: paternity
    datatype: yesnoradio
---
id: Cases in 2 states - still going?
question: |
  Is the case in the other state still going on?
fields:
  - no label: stage_of_other_case
    input type: radio
    choices:
      - Yes.: still going
      - No, it is over and the court in that case ended our marriage.: ended with order
      - No, the case was closed before it was finished and the court did not end our marriage: ended with no order
---
id: Ongoing
question: |
  One of the courts will close their case
subquestion: |
  Only one state court can enter a custody order and parenting plan, so one of the courts will close their case. 
continue button field: ongoing
---
id: Dismiss
question: |
  You can file a “Motion to Dismiss” in your Alaska case
subquestion: |
  % if user_need == 'answer divorce':
  If you are already divorced, the Alaska Court cannot divorce you again.
  % endif
  If the case in the other state is over and 
  % if user_need == 'answer custody':
  there is no custody order or parenting plan
  % elif user_need == 'answer divorce':
   the other court ended your marriage
   % endif
   , you can file a “Motion to Dismiss”  when you respond in your Alaska case.
continue button field: dismiss
---
id: Other case is over
question: |
  Do you want information about jurisdiction added to your Action Plan?
subquestion: |
  If the case in the other state is over 
  % if user_need == 'answer custody':
  and there is no custody order or parenting plan
  % elif user_need == 'answer divorce':
  and the other court did not end your marriage
  % endif
  , you can move forward with the Alaska case.
continue button field: other_case_over  
