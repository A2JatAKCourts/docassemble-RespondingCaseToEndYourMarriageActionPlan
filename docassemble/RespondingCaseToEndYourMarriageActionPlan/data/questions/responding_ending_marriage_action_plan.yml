id: Minor children
question: |
  Do you and ${ other_party_in_case } have any children who are under age 18?
fields:
  - no label: minor_children
    datatype: yesnoradio
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more####
  Why does it matter if we have any children under age 18?

  It affects the documents you use to respond in your case.
---
id: Type of case
question: |
  What type of case did ${ other_party_in_case } start?
fields:
  - Case description: case_type
    datatype: radio
    choices:
      - Divorce: divorce
      - Legal Separation: legal separation
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more####
  How can I find out?

  The documents you got from ${ other_party_in_case } should include a “Complaint” which says 'divorce' or 'legal separation.
---
id: Counselling info
question: |
  I do not want a divorce
subquestion: |
  One spouse cannot stop the other spouse from getting a divorce. If either spouse tells the court the marriage has broken down and cannot be saved, the court will grant the divorce. 
fields:
  - Do you want information about finding a therapist or a marriage counselor?: counseling
    datatype: yesnoradio
---
id: Military
question: |
  Are you or ${ other_party_in_case } in the military? 
fields: 
  - no label: military
    datatype: yesnoradio
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more ####
  Why does this matter?
  
  % if type_of_response['wrong state']:
  Why does it matter if one of us is in the military?
  There are different rules for military members when deciding if the Alaska court can hear the case to end your marriage. 
  % elif type_of_response['case in 2 states']:
  Why does it matter where if one of us is stationed in Alaska?
  The Alaska court only has authority to grant a divorce for people who have connections to Alaska, such as being a military member stationed in Alaska.
  % elif type_of_response['default']:
  Why does it matter if I am in the military?
  Military members have special protections against default judgments.
  % endif
---
id: Residency
question: |
  % if minor_children:
  Are both of these true?
  % else:
  Have you and ${ other_party_in_case } lived in Alaska for 6 months in the last 6 years?
  % endif
subquestion: |
  % if minor_children:
  (1) you or ${ other_party_in_case } have lived in Alaska for 6 months in the last 6 years, and

  (2) your children have lived in Alaska for the last 6 months?
  % endif
fields:
  - In Alaska for 6 months?: residency
    datatype: yesnoradio
    css class: no-required-asterisk
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more ####
  Why does it matter where we live?
  
  Generally, both spouses have to live in Alaska for 6 months in the last 6 years 
  % if minor_children:
  and children have to live in Alaska for at least 6 months 
  % endif 
  for the Alaska court to have the authority, called “jurisdiction,” to decide your case.
---
id: Jurisdiction
question: |
  Jurisdiction
subquestion: |
  % if minor_children: 
  % if residency:
  Because you 
  % if military:
  or
  % else:
  and
  % endif
  ${ other_party_in_case } have lived in Alaska for 6 months in the last 6 years and your children have lived in Alaska for the last 6 months, the Alaska court may have the authority, called “jurisdiction,” to decide your case. 
  
  If you think your case is an exception, you may want to talk to a lawyer or contact the Alaska Family Law Self-Help Center. 
  % else:
  Because you and ${ other_party_in_case } have not lived in Alaska for 6 months in the last 6 years, or your children have not lived in Alaska for the last 6 months, the Alaska court may not have the authority, called “jurisdiction,” to decide your case. 
  % endif 
  % elif not minor_children:
  % if residency:
  Because you 
  % if military:
  or
  % else:
  and
  % endif
  ${ other_party_in_case } have lived in Alaska for 6 months in the last 6 years, the Alaska court may have the authority, called “jurisdiction,” to decide your case. If you think your case is an exception, you may want to talk to a lawyer or contact the Alaska Family Law Self-Help Center. 
  % else:
  Because you and ${ other_party_in_case } have not lived in Alaska for 6 months in the last 6 years, the Alaska court may not have the authority, called “jurisdiction,” to decide your case.
  % endif 
  % endif 

  Information about residency has been added to your Action Plan. Do you want to continue answering questions for more information about responding to the case, or quit and get your Action Plan to learn more about residency now?
fields:
  - Continue or quit?: jurisdiction
    input type: radio
    choices:
      - Continue: True
      - Quit and get my Action Plan: False
    css class: no-required-asterisk
