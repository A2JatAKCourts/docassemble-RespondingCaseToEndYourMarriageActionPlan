comment: |
  This question is used to introduce your interview. Please customize
id: responding_in_your_ending_marriage_case_action_plan - intro validation code
continue button field: responding_ending_marriage_action_plan_intro
question: |
  Responding in your case to end your marriage
subquestion: |
  This Guided Assistant asks you questions and uses your answers to build a Personal Action Plan - a list of steps to help you respond in your child custody case. Your Action Plan will include information about the Alaska court process and other resources.
  
  What information do you need?
fields:
  - label: My spouse started a court case to end our marriage and I want to respond.
    field: type_of_response['ak divorce case']
    datatype: yesnowide
  - label: My spouse started a court case to end our marriage, but did not give me the filed documents in the correct way.
    field: type_of_response['improper service']
    datatype: yesnowide
    help: |
      ${ capitalize(other_party_in_case) } is supposed to give you a copy by process server, or send it by certified mail/restricted delivery/return receipt. 
  - label: My spouse started a court case to end our marriage in Alaska, but I think the case should be in a different state.
    field: type_of_response['wrong state']
    datatype: yesnowide
    disable if: type_of_response['case in 2 states']
    help: |
      Pick this choice if only one case was filed and you think it should **not** have been filed in Alaska. 
  - label: 2 cases to end our marriage were filed – Alaska and another state.
    field: type_of_response['case in 2 states']
    datatype: yesnowide
    disable if: type_of_response['wrong state']
    help: |
      Pick this choice if cases to end your marriage were filed in both Alaska and another state. This choice includes steps if you think Alaska is the wrong state.
  - label: My spouse started a case to end our marriage, I did not respond, and I got papers about a "default judgment."
    field: type_of_response['default']
    datatype: yesnowide
  - label: My spouse has not started a case to end our marriage yet, but wants to see if we can end the marriage and agree on all the issues.
    field: type_of_response.nocase
    datatype: yesnowide
    uncheck others: True
  - label: My spouse wants to end the marriage, but I want to stay married..
    field: type_of_response['stay married']
    datatype: yesnowide
validation code: |
  # Mark type_of_response as gathered so DA won’t ask for more answers
  type_of_response.gathered = True

  # Seed defaults: make sure every checkbox key exists with a True/False value
  for k in (
      'ak divorce case',
      'improper service',
      'wrong state',
      'case in 2 states',
      'default',
      'nocase',
      'stay married',
  ):
      type_of_response.setdefault(k, False)

  # Enforce mutual exclusivity:
  # If both somehow end up True, "case in 2 states" takes priority
  if type_of_response.get('case in 2 states', False):
      type_of_response['wrong state'] = False
  elif type_of_response.get('wrong state', False):
      type_of_response['case in 2 states'] = False


  
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more ####
  We provide information about the process in Alaska only. Look for information in other states on their [court](https://www.ncsc.org/information-and-resources/state-court-websites) and [legal aid programs'](https://lawhelp.org) websites.
