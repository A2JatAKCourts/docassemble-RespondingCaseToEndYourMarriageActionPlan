comment: |
  2025-09-19
template: answer_divorce_step
subject: |
  Step ${ answer_divorce_idx }:
  % if type_of_response['wrong state'] and (user_need == 'answer custody' and not jurisdiction): 
  Fill out the forms to respond
    % if not(type_of_response.any_true('improper service', 'default') and not proper_service):
      in 20 days
    % endif
   and ask to dismiss if you think Alaska is the wrong state
  % else:  
    % if type_of_response.all_true('improper service', exclusive = True) \
      or (type_of_response['improper service'] and not proper_service and \
        ((type_of_response['wrong state'] and (user_need == 'answer custody' and jurisdiction)) or (type_of_response['case in 2 states'] and stage_of_other_case == 'ended with no order'))) \
      or (type_of_response['default'] and stage_of_default in ('application filed', 'hearing scheduled') and ((type_of_response['wrong state'] and (user_need == 'answer custody' and jurisdiction)) or (type_of_response['case in 2 states'] and stage_of_other_case == 'ended with no order'))) \
      or (type_of_response.all_true('default', exclusive = True) and stage_of_default in('application filed', 'hearing scheduled')):
    If you decide to move forward, fill
  % elif type_of_response['case in 2 states'] and stage_of_other_case == 'still going' and ((type_of_response['default'] and stage_of_default in('application filed', 'hearing scheduled')) or type_of_response.all_false('default')):
    If you decide to move forward in Alaska, fill 
  % else:
    Fill
  % endif
    out the forms to answer the complaint
    % if type_of_response.all_true('improper service', exclusive = True) or (not (type_of_response.any_true('improper service', 'default') and not proper_service)):
    and respond within 20 days
    % endif
  % endif
content: |
  % if not(type_of_response.any_true('improper service', 'default') and not proper_service):
  You have **20 days** from the date you get the complaint to:
  % endif 

  1.	File an **Answer** and other required forms with the court to tell the judge what you want to happen in your case.
  2.	Give a copy of the forms to the other parent. See Step ${ answer_file_and_serve_idx }.
  
  % if type_of_response['wrong state'] and (user_need == 'answer custody' and not jurisdiction):
  If you think Alaska is not the "home state," you can ask the court to dismiss your case:
  
    * Fill out your **Answer** and tell the Alaska court why you think the case should be in another state.
    * Fill out the **Motion to Dismiss** forms that ask the court to dismiss your case. Read Step ${ dismiss_idx }: File a motion to dismiss your Alaska case.
    * File the motion forms with your **Answer**.
  % endif
 
  <div class="step-subheading">Use</div>
  % if user_need == 'answer custody':
   **ANSWER AND COUNTERCLAIM TO COMPLAINT FOR CUSTODY OF MINOR CHILDREN, DR-450** [[Fill-in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-450.pdf)]
 
  % endif
  % if user_need == 'answer divorce':
  % if minor_children or wife_is_pregnant in('husband', 'not husband'):
    % if type_of_response['ak divorce case'] and case_type == 'divorce':
       **ANSWER AND COUNTERCLAIM TO COMPLAINT FOR DIVORCE WITH CHILDREN, DR-832** [[Fill-in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-832.pdf)]
    % elif type_of_response['ak divorce case'] and case_type == 'legal separation':
      **Answer & Counterclaim to Legal Separation With Children, SHC-094** [Word](https://courts.alaska.gov/shc/family/docs/shc-094.doc) | [PDF](https://courts.alaska.gov/shc/family/docs/shc-094n.pdf)
    % endif
    % if not minor_children and wife_is_pregnant in('husband', 'not husband'):
      You must use this form because wife is pregnant.
    % endif
  % elif not minor_children and wife_is_pregnant == 'not pregnant':
    % if type_of_response['ak divorce case'] and case_type == 'divorce':
      **ANSWER AND COUNTERCLAIM TO COMPLAINT FOR DIVORCE WITHOUT CHILDREN, DR-837** [[Fill-in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-837.pdf)]
    % elif type_of_response['ak divorce case'] and case_type == 'legal separation':
      **Answer & Counterclaim to Legal Separation Without Children, SHC-095** [Word](https://courts.alaska.gov/shc/family/docs/shc-095.doc) | [PDF](https://courts.alaska.gov/shc/family/docs/shc-095.pdf)
    % endif
  % endif
  % endif
  
  1. At the top of the **Answer & Counterclaim** form, put your name, mailing address, contact phone number, and email address.
  
  2. Fill out the rest of the top section **exactly** as it is filled out on ${ other_party_in_case }'s complaint:
  
      * the location of the court,
      * ${ other_party_in_case }'s name goes above the line for the plaintiff's name,
      * your name goes above the line for the defendant's name, and
      * the case number from the complaint.
      This section of the form is called the 'Caption.'
  
  3. The Answer section:<br>
  Look at each paragraph in ${ other_party_in_case }'s complaint and decide if you agree, disagree, or you are not sure.

    % if (user_need == 'answer custody' and type_of_response.all_true('ak custody case', exclusive = True)) or (user_need == 'answer divorce' and type_of_response.all_true('ak divorce case', exclusive = True)):
      % if (case_type == 'custody' or case_type == 'divorce' or (case_type == 'legal separation' and want_legal_separation == 'yes')) and response_to_complaint == 'agree':
          * If you agree with what ${ other_party_in_case } asked for in their complaint, check the box in this section that says you "agree with all of the statements in the complaint."
      % elif (case_type == 'custody' or case_type == 'divorce' or (case_type == 'legal separation' and want_legal_separation == 'yes')) and response_to_complaint == 'some':
          * If you disagree with any of the paragraphs in the complaint, list the paragraph numbers you disagree with.
      % else:
          * Check the appropriate box in your Answer.
            * If you disagree with any of the paragraphs in the complaint, list the paragraph numbers you disagree with.
            * If you are not sure if you agree or disagree with any of the paragraphs in the complaint, list the paragraph numbers you are not sure about.
      % endif
    % endif

  4. Affirmative Defenses:<br>An affirmative defense is the facts and arguments that attack the plaintiff's legal right to bring the court case.<br> 
    The affirmative defense can mean you win your case even if everything in the plaintiff's complaint is true.<br> 
    If you are unsure if an affirmative defense applies to you, [talking to a lawyer](https://courts.alaska.gov/shc/shclawyer.htm) can help because this is a complicated and important area.<br> 

    % if type_of_response['wrong state'] and ((user_need == 'answer custody' and not jurisdiction) or (user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband', 'not husband')))):
    * If you think Alaska is not the "home state," you can ask the court to dismiss your case. Check the box, "I state the following affirmative defense(s)."
      % if user_need == 'answer custody' or (user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband','not husband'))):
    * If you think Alaska is not the "home state," you can ask the court to dismiss your case.
      * Check the box that describes the reason you think Alaska is the wrong state to decide custody of your children.
      * Check the box that says you are attaching a **Motion to Dismiss for Lack of Jurisdiction**.
      % endif
    % endif

    % if user_need == 'answer divorce' and type_of_response['wrong state']:
    * Check the box, that describes the reason you think Alaska is the wrong state to decide your ${ case_type } case.
    * Check the box that says you are attaching a **Motion to Dismiss**.
    % endif

    % if type_of_response['case in 2 states'] and stage_of_other_case == 'still going':
      If you want your case in the other state, you can tell the Alaska court by stating it in your **Answer** and filing a **Motion to Dismiss** your Alaska case.
  
    * Check the "other" box and tell the Alaska court:
      * There is another case,
      * the court location, and
      * the case number.
    % endif

    % if type_of_response.all_true('improper service', exclusive = True) or (type_of_response.all_true('improper service', 'wrong state') or type_of_response.all_true('improper service', 'case in 2 states') or (type_of_response['default'] and stage_of_default in('application filed', 'hearing scheduled')) and not proper_service):
    * You can add here that you were not served correctly.
    % endif
  If you have no affirmative defenses:
    
    * Check the box at the beginning of the section that states "I have no affirmative defenses." 
    * Go to the Counterclaims section.
  
  5. Counterclaims:<br>
  % if user_need == 'answer custody' or (user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband', 'not husband'))):
    Fill out the Counterclaim section with the parenting plan you want the judge to order.
  % endif 
    % if type_of_response['wrong state'] and ((user_need == 'answer custody' and not jurisdiction) or user_need == 'answer divorce'):
      Check the box at the beginning of this section that says, "I have stated above that the case should be dismissed because the Alaska court does not have jurisdiction over 
      % if user_need == 'answer custody':
        the child(ren).
      % elif user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband', 'not husband')):
        the marital estate and/or child custody.
      % elif user_need == 'answer divorce' and not minor_children and wife_is_pregnant == 'not pregnant':
        the marital estate.
      % endif
    % endif

  % if type_of_response['case in 2 states'] and stage_of_other_case == 'still going':
    If you think the Alaska court should hear the case, use section 5 to tell the judge there are 2 cases
    % if (user_need == 'answer custody' and jurisdiction) or user_need == 'answer divorce':
    and why you think the case should move forward in Alaska.
    
    
     Include where the children have lived the last 6 months.
    % elif (user_need == 'answer custody' and not jurisdiction) or user_need == 'answer divorce':
    Explain why you think the Alaska court should hear the case even though your children have not lived in Alaska 6 months.
    % endif
  % endif


    % if type_of_response['ak divorce case']:
      % if (case_type == 'legal separation' and want_legal_separation == 'yes') or case_type == 'divorce':
        If you agree with everything in the Complaint and do not have any counterclaims, mark the box at the beginning of the section that says "I have no counterclaims" and go to the "Request for Relief" section.
      % elif case_type == 'legal separation' and want_legal_separation == 'unsure':
        If you decide you want a divorce instead of a legal separation, check the box telling the court "I do NOT agree to a legal separation because I want the marriage to end in a divorce".
      % elif case_type == 'legal separation' and want_legal_separation == 'no':
        Check the box telling the court "I do NOT agree to a legal separation because I want the marriage to end in a divorce."
      % endif
    % endif

    6. Request for Relief:<br>
    % if type_of_response['wrong state'] and (user_need == 'answer custody' and not jurisdiction):
        * You can add here that you want the court to dismiss your case.
    % endif
    % if type_of_response['case in 2 states'] and stage_of_other_case == 'still going':
      Use the Request for Relief section to ask the judge to move forward with the case in Alaska or dismiss it
    % endif
    If there is anything else you want the judge to order, you can write it here.
  
    % if type_of_response['default'] and stage_of_default in('application filed', 'hearing scheduled'):
      % if stage_of_default == 'application filed' and proper_service:
        Because you did not file an **Answer** within 20 days of getting the Complaint, ask the judge to accept your **Answer** even though it is late.
        Fill out a **TF-706 Motion (Request) and Affidavit** [Fill-in PDF](https://public.courts.alaska.gov/web/forms/docs/tf-706.pdf).
          * Fill in the title  "accepting a late Answer". And
          * File it with your Answer.
      % endif
      % if stage_of_default == 'hearing scheduled':
        Because the clerk signed the entry of default, you will have to ask the judge to accept your Answer even though it is late.
        Fill out a **Motion, Affidavit, and Order to Set Aside Entry of Default and Accept Late Filed Answer, CIV-858** [[Fill-in PDF](https://public.courts.alaska.gov/web/forms/docs/civ-858.pdf)].
          * Explain why you did not reply in 20 days.
          * File it with your Answer.
      % endif
    % endif

    % if type_of_response['wrong state'] and ((user_need == 'answer custody' and not jurisdiction) or user_need == 'answer divorce'):
      If you have any questions about whether Alaska is the correct place for your case or you want to ask the court to dismiss your case, you may want to [talk to a lawyer](https://courts.alaska.gov/shc/shclawyer.htm)
    % endif

  **Information Sheet, DR-314** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-314.pdf)
  
    * If ${ other_party_in_case } filed an **Information Sheet**, check the first box.
    * If they did not file this form, answer 1 through 3.
    * Sign, and date the form.

    % if user_need == 'answer custody' or (user_need == 'answer divorce' and minor_children):
    **Child Custody Jurisdiction Affidavit, DR-150** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-150.pdf)<br>
      % if type_of_response['case in 2 states'] and stage_of_other_case == 'still going':
  In paragraph 3 on page 3, tell the judge about the other case.
      % endif
  **Wait** to sign this affidavit until you can sign in front of a notary or file the form at court.

  **Child Support Guidelines Affidavit, DR-305** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-305.pdf)<br>
  See [How to Fill out the Child Support Guidelines Affidavit](http://courts.alaska.gov/shc/family/docs/shc-dr305f-sample.pdf) to help you fill in this form.
  
    * Attach your most recent tax return and pay stubs to the **Child Support Guidelines Affidavit**.
    * **Wait** to sign this affidavit until you can sign in front of a notary or file the form at court.

  <div class="step-subheading">Wait</div>
  **Wait** to sign your affidavits until you are in front of someone who has the power to take oaths, like a notary public.
  
  * The court clerk can do this for free.
  * Bring a valid photo ID with you.
  * If you cannot get to a notary or someone with the power to take oaths, you can "self-certify." Use:<br>
    **Self-Certification (No Notary Available), TF-835** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/tf-835.pdf)
  % endif

    % if (user_need == 'answer custody' and type_of_response.all_true('ak custody case', exclusive = True)) or (user_need == 'answer divorce' and type_of_response.all_true('ak divorce case', exclusive = True)):
      % if response_to_complaint in('agree','some') or (response_to_complaint == 'none' and want_help_to_agree):
        % if response_to_complaint in('agree', 'some'):
          <div class="step-subheading">Forms to use if you and the other parent write out your agreement</div>
          If you want to work with the other parent to write out the agreement and both sign it, use:
        % endif
        % if response_to_complaint == 'none' and want_help_to_agree:
          Forms to use if you reach an agreement
        % endif
        % if user_need == 'answer custody' or (user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband', 'not husband')):
          **Parenting Plan Agreement & Order, SHC-1128** [Word](https://courts.alaska.gov/shc/family/docs/shc-1128.doc) | [PDF](https://courts.alaska.gov/shc/family/docs/shc-1128n.pdf)
          Do **not** sign the Order section.
        % endif
        **Joint Motion to Put Settlement on the Record, SHC-1063** [Word](https://courts.alaska.gov/shc/family/docs/shc-1063.doc) | [PDF](https://courts.alaska.gov/shc/family/docs/shc-1063n.pdf)
        % if user_need == 'answer custody' or (user_need == 'answer divorce' and (minor_children or wife_is_pregnant in('husband', 'not husband')):
          **Custody Findings of Fact & Conclusions of Law, DR-460** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-460.pdf)
          **Custody Judgment, DR-465** [Fill in PDF](https://public.courts.alaska.gov/web/forms/docs/dr-465.pdf)
        % endif
      % endif
    % endif