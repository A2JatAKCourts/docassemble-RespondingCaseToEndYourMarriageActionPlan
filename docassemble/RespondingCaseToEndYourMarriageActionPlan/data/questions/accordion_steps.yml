template: divorce_legal_separation_diff_step
subject: |
  Step ${ divorce_legal_separation_diff_idx }: Learn more about the differences between legal separation and divorce
content: |
  If the health insurance will not change after a legal separation, the spouses may want a legal separation to keep the coverage.

  Some insurance companies may not continue coverage after the court issues a **Legal Separation Decree** so if you need your spouse’s medical insurance, talk to a lawyer before the legal separation is finalized to understand your options for continued coverage.

  If you and your spouse want to legally separate but stay married to protect significant religious, financial, social or legal interests, the court can issue a **Decree of Legal Separation**. You will still be married, but the court will 
  % if not minor_children and wife_is_pregnant == 'not pregnant':
  divide the property and debt earned or received during the marriage.
  % else:
    * Divide the property and debt earned or received during the marriage.
    * Issue a parenting plan that states:

      1. A schedule for each parent to spend time with the children and 
      2. How the parents make decisions about the children. And
    * Issue a child support order that states which parent will pay child support according to the child support rule.
    % endif

    Remember, either you or your spouse can turn a legal separation into a divorce at any time:
    
    * If you are not sure what you want, you can proceed with a legal separation, and change it to a divorce at any time.
    * If you decide you do not want a legal separation, check the box telling the court “I do not agree to a legal separation because I want the marriage to end in a divorce” in the “Counterclaims” section of your **Answer** (pages 2-3).
